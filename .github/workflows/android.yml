name: Android debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Keep only the newest validation run for this branch; cancel stale emulator runs.
concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      # Catch Android instrumentation test compilation errors before spending
      # time booting the emulator.
      - name: Compile Android instrumentation tests
        run: gradle --no-daemon compileDebugAndroidTestKotlin

      # Produce the installable APK before emulator UI tests. A slow or
      # unavailable emulator must not prevent a valid APK from being uploaded.
      - name: Build debug APK
        id: build_apk
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest --stacktrace || { adb logcat -d -t 2500 | tail -n 250; exit 1; }
